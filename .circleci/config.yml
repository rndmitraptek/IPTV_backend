version: 2.1

jobs:
  build-development:
    machine:
      image: ubuntu-2004:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Login to dockerhub
          command: |
            echo "$DOCKER_PASS" | docker login --username $DOCKER_USER --password-stdin
      - run:
          name: Build dockerfile
          command: |
            docker build --no-cache -t rndmitraptek/iptv_backend:$CIRCLE_SHA1 .
      - run:
          name: Push Docker Image
          command: |
            docker push rndmitraptek/iptv_backend:$CIRCLE_SHA1
            docker tag rndmitraptek/iptv_backend:$CIRCLE_SHA1 rndmitraptek/iptv_backend:development-latest
            docker push rndmitraptek/iptv_backend:development-latest
      - add_ssh_keys:
          fingerprints:
            - 'SHA256:ZHMnziJ4o8Vj9/jdhbJMvxbSQxez2SzML5tI9AFrI5w'
      - run:
          name: Prune unused Docker images
          command: docker image prune -f
      - run:
          name: Deploy app to server
          command: |
            ssh -o StrictHostKeyChecking=no iptv-admin@178.128.17.86 "cd aplikasiIPTV/deployer/ && ./backend.sh"

  build-harris-development:
    machine:
      image: ubuntu-2004:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Login to dockerhub
          command: |
            echo "$DOCKER_PASS" | docker login --username $DOCKER_USER --password-stdin
      - run:
          name: Build dockerfile
          command: |
            docker build --no-cache -t rndmitraptek/iptv_backend:$CIRCLE_SHA1 .
      - run:
          name: Push Docker Image
          command: |
            docker push rndmitraptek/iptv_backend:$CIRCLE_SHA1
            docker tag rndmitraptek/iptv_backend:$CIRCLE_SHA1 rndmitraptek/iptv_backend:harris-development-latest
            docker push rndmitraptek/iptv_backend:harris-development-latest
      - add_ssh_keys:
          fingerprints:
            - 'SHA256:ZHMnziJ4o8Vj9/jdhbJMvxbSQxez2SzML5tI9AFrI5w'
      - run:
          name: Prune unused Docker images
          command: docker image prune -f
      - run:
          name: Deploy app to server
          command: |
            ssh -o StrictHostKeyChecking=no iptv-admin@178.128.17.86 "cd aplikasiIPTV/deployer/ && ./deploy_harris_dev.sh"

  build-harris-live:
    machine:
      image: ubuntu-2004:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Login to dockerhub
          command: |
            echo "$DOCKER_PASS" | docker login --username $DOCKER_USER --password-stdin
      - run:
          name: Build dockerfile
          command: |
            docker build --no-cache -t rndmitraptek/iptv_backend:$CIRCLE_SHA1 .
      - run:
          name: Push Docker Image
          command: |
            docker push rndmitraptek/iptv_backend:$CIRCLE_SHA1
            docker tag rndmitraptek/iptv_backend:$CIRCLE_SHA1 rndmitraptek/iptv_backend:harris-live-latest
            docker push rndmitraptek/iptv_backend:harris-live-latest
      - add_ssh_keys:
          fingerprints:
            - 'SHA256:ZHMnziJ4o8Vj9/jdhbJMvxbSQxez2SzML5tI9AFrI5w'
      - run:
          name: Prune unused Docker images
          command: docker image prune -f
      - run:
          name: Deploy app to server
          command: |
            ssh -o StrictHostKeyChecking=no iptv-admin@178.128.17.86 "cd aplikasiIPTV/deployer/ && ./deploy_harris_live.sh"
workflows:
  basic-workflow:
    jobs:
      - build-development:
          filters:
            branches:
              only:
                - development
      - build-harris-development:
          filters:
            branches:
              only:
                - harris-development
      - build-harris-live:
          filters:
            branches:
              only:
                - harris-live
