version: 2.1

jobs:
  build-development:
    machine:
      image: ubuntu-2004:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Login to dockerhub
          command: |
            echo "$DOCKER_PASS" | docker login --username $DOCKER_USER --password-stdin
      - run:
          name: Build dockerfile
          command: |
            docker build --no-cache -t mitraptek/iptv_backend:$CIRCLE_SHA1 .
      - run:
          name: Push Docker Image
          command: |
            docker push mitraptek/iptv_backend:$CIRCLE_SHA1
            docker tag mitraptek/iptv_backend:$CIRCLE_SHA1 mitraptek/iptv_backend:development-latest
            docker push mitraptek/iptv_backend:development-latest
      - add_ssh_keys:
          fingerprints:
            - 'SHA256:Um6KQaHmZjgcT6qChLKXnKedpT9YGZfMVAHUG0Wn+LE'
      - run:
          name: Deploy app to server
          command: |
            ssh -o StrictHostKeyChecking=no iptv-admin@206.189.38.25 "cd deployer/ && ./deploy-satunapas-backend.sh"
workflows:
  basic-workflow:
    jobs:
      - build-development:
          filters:
            branches:
              only:
                - development